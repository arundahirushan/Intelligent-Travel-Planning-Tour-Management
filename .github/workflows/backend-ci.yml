name: Backend CI

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore server/TourManagement.sln
      - run: dotnet build server/TourManagement.sln --no-restore --configuration Release
      - run: dotnet test server/TourManagement.sln --no-build --configuration Release
